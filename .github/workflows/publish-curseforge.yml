name: Publish XPBar Island to CurseForge

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - '.github/workflows/publish-curseforge.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  bootstrap-v1-0-11:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Validate and trigger v1.0.11 release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the latest addon
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check addon syntax and version
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find Core Data Locale Settings UI -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
          grep -q '^## Version: 1.0.11$' XPBarIsland.toc
          grep -q 'OOC_EXIT_FADE = 1.5' UI/Island.lua
          grep -q 'OOC_ENTER_FADE = 0.4' UI/Island.lua
          grep -q 'OOC_HOVER_MARGIN = 24' UI/Island.lua
          grep -q '@andygoyap' CHANGELOG.md
          echo 'Lua syntax and release metadata validated.'
      - name: Create release tag and dispatch publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.11"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists. Will not overwrite or republish automatically."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "XPBar Island 1.0.11 — Now You See XP"
          git push origin "refs/tags/${TAG}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-curseforge.yml/dispatches" \
            -f ref=main -F "inputs[tag]=${TAG}"
          echo "Dispatched release publishing for ${TAG}"

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: Package and publish WoW addon
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged addon release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Prepare a clean addon package
        run: |
          cat > .pkgmeta <<'PKGMETA'
          package-as: XPBarIsland
          ignore:
            - .github
            - .gitignore
            - README.md
            - CHANGELOG.md
            - CURSEFORGE.md
            - KNOWN_GAPS.md
            - tools
            - logo.png
            - .opencode
            - XPBar Fix Kit
          PKGMETA

      - name: Upload tagged release to CurseForge
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1728478
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
